<!DOCTYPE html>

  <head>

    <title>Business Card</title>
    <link rel="stylesheet" href="index.css" />

    <div class="card">
      <img
        class="avatar"
        src="images/kglass.jpg"

        <h1>Kirubel Esayas</h1>

        <p class="coming-soon">
          🚀 Full portfolio website is currently under development.<br />
          This is a preview card — the complete experience is coming soon.
        </p>

        <div class="socials">
          <a href="#"><i class="fa fa-twitter"></i></a>
          <a href="#"><i class="fa fa-linkedin"></i></a>
          <a href="#"><i class="fa fa-instagram"></i></a>
        </div>

        <p>
          <a href="https://t.me/Kirubel_E7" target="_blank">
            <button class="btn">Contact Me</button>
          </a>
        </p>
      </div>
    </div>
